services:
  # PostgreSQL 16 + pgvector (mapped to 5433 to avoid clashing with any native install)
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai_solution_builder_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ai_solution_builder}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ai_solution_builder}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Redis 7 (rate limiting, cache, queues)
  redis:
    image: redis:7-alpine
    container_name: ai_solution_builder_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # Backend API (buildable, optional for local dev — uvicorn usually runs on host)
  backend:
    build:
      context: ./backend
    container_name: ai_solution_builder_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ai_solution_builder}
      REDIS_URL: redis://redis:6379/0
      APP_ENV: ${APP_ENV:-production}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL_NAME: ${GROQ_MODEL_NAME:-openai/gpt-oss-120b}
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-this-to-a-long-random-string-in-production}
      OPENCODE_SERVER_URL: http://opencode:4096
      MVP_BUILD_DIR: .data/mvp_builds
    ports:
      - "8000:8000"
    volumes:
      - mvp_workspace:/app/.data/mvp_builds
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      opencode:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  # Background Build Worker — claims queued MVP builds and runs OpenCode generation + verification
  worker:
    build:
      context: ./backend
    container_name: ai_solution_builder_worker
    restart: unless-stopped
    command: ["worker"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ai_solution_builder}
      REDIS_URL: redis://redis:6379/0
      APP_ENV: ${APP_ENV:-production}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL_NAME: ${GROQ_MODEL_NAME:-openai/gpt-oss-120b}
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-this-to-a-long-random-string-in-production}
      OPENCODE_SERVER_URL: http://opencode:4096
      MVP_BUILD_DIR: .data/mvp_builds
      WORKER_MODE: worker
    volumes:
      - mvp_workspace:/app/.data/mvp_builds
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
      opencode:
        condition: service_started

  # OpenCode sidecar — headless AI coding agent that generates MVP source code.
  # The /workspace volume is shared with the backend's MVP_BUILD_DIR so the API
  # can read generated files directly without a network hop.
  #
  # PARALLEL POOL (one container per concurrent build/session):
  #   docker compose up --scale opencode=3
  # Compose names replicas opencode-1, opencode-2, opencode-3 on the internal
  # network. Point the backend at all of them (comma-separated) so builds are
  # hashed across containers deterministically:
  #   OPENCODE_POOL_URLS=http://opencode-1:4096,http://opencode-2:4096,http://opencode-3:4096
  # (no host port is published below — the fixed container_name was removed so
  # scaling doesn't collide).
  opencode:
    build:
      context: ./backend/opencode
    restart: unless-stopped
    environment:
      OPENCODE_ZEN_API_KEY: ${OPENCODE_ZEN_API_KEY:-}
      OPENCODE_MODEL: ${OPENCODE_MODEL:-opencode/big-pickle}
      OPENCODE_AGENT: ${OPENCODE_AGENT:-mvp-builder}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL_NAME: ${GROQ_MODEL_NAME:-openai/gpt-oss-120b}
    volumes:
      - mvp_workspace:/workspace
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4096/api/info').then(r=>{if(r.ok)process.exit(0);return fetch('http://localhost:4096/global/health')}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Frontend — Next.js standalone build (browser talks to backend on :8000)
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    container_name: ai_solution_builder_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  mvp_workspace:
    driver: local