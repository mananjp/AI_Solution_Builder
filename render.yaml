# Single-instance production topology: Next.js, FastAPI, OpenCode, and the
# queue worker share one container and one persistent workspace disk.
# PostgreSQL (with pgvector) and Redis are managed external services.
services:
  - type: web
    name: ai-solution-builder-app
    runtime: docker
    plan: standard
    dockerfilePath: ./app.Dockerfile
    dockerContext: .
    dockerCommand: app
    healthCheckPath: /ready
    maxShutdownDelaySeconds: 120
    disk:
      name: ai-solution-builder-workspace
      mountPath: /workspace
      sizeGB: 10
    envVars:
      - key: APP_NAME
        value: AI Solution Builder
      - key: APP_ENV
        value: production
      - key: APP_ROLE
        value: app
      - key: CORS_ORIGINS
        value: https://ai-solution-builder-app.onrender.com
      - key: FRONTEND_URL
        value: https://ai-solution-builder-app.onrender.com
      - key: NEXT_PUBLIC_API_URL
        value: /api/v1
      - key: NEXT_PUBLIC_AUTH0_DOMAIN
        sync: false
      - key: NEXT_PUBLIC_AUTH0_CLIENT_ID
        sync: false
      - key: NEXT_PUBLIC_AUTH0_AUDIENCE
        sync: false
      - key: NEXT_PUBLIC_AUTH0_CALLBACK_URL
        value: https://ai-solution-builder-app.onrender.com/callback
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: AUTH0_DOMAIN
        sync: false
      - key: AUTH0_AUDIENCE
        sync: false
      - key: AUTH0_ENABLED
        value: "true"
      - key: DEV_AUTH_BYPASS
        value: "false"
      - key: SECRET_ENCRYPTION_KEY
        generateValue: true
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL_NAME
        value: openai/gpt-oss-120b
      - key: OPENCODE_ZEN_API_KEY
        sync: false
      - key: OPENCODE_SERVER_USERNAME
        value: opencode
      - key: OPENCODE_SERVER_PASSWORD
        sync: false
      - key: OPENCODE_MODEL
        value: opencode/big-pickle
      - key: OPENCODE_AGENT
        value: mvp-builder
      - key: OPENCODE_SERVER_URL
        value: http://127.0.0.1:4096
      - key: ENABLE_OPENCODE_SIDECAR
        value: "true"
      - key: WORKER_MODE
        value: worker
      - key: MVP_BUILD_DIR
        value: /workspace
      - key: UPLOAD_DIR
        value: /workspace/uploads
      - key: EXPORT_DIR
        value: /workspace/exports
      - key: SECURITY_QUARANTINE_DIR
        value: /workspace/quarantine
      - key: STORAGE_BACKEND
        value: local
      - key: MVP_BUILD_TIMEOUT
        value: "600"
      - key: MVP_VERIFY_INSTALL_TIMEOUT
        value: "180"
      - key: MVP_VERIFY_BUILD_TIMEOUT
        value: "120"
      - key: MVP_VERIFY_NPM
        value: "false"
      - key: DB_POOL_SIZE
        value: "3"
      - key: DB_MAX_OVERFLOW
        value: "2"
      - key: UVICORN_WORKERS
        value: "1"
