# AI Solution Builder — Render Blueprint (2-service architecture)
# Reference: https://render.com/docs/blueprint-spec
#
# Managed services (zero Render containers):
# - PostgreSQL + pgvector : Neon (DATABASE_URL)
# - Redis cache/queue     : Upstash (REDIS_URL)
# - Artifact storage      : Cloudinary (STORAGE_BACKEND=cloudinary)
#
# Services:
#   1. ai-solution-builder          public web    Next.js (:3000, proxies /api -> 127.0.0.1:8000) + FastAPI
#   2. ai-solution-builder-builder  worker (internal)  opencode (:4096) + background build worker (shared /workspace)

services:
  # ── App (FastAPI + Next.js) ────────────────────────────────────────────────
  - name: ai-solution-builder-app
    type: web
    runtime: docker
    plan: starter
    dockerfilePath: ./backend.Dockerfile
    dockerCommand: api
    healthCheckPath: /ready
    envVars:
      - key: APP_NAME
        value: AI Solution Builder
      - key: APP_ENV
        value: production
      - key: APP_ROLE
        value: api
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL_NAME
        value: openai/gpt-oss-120b
      - key: LLM_PROVIDER
        value: groq
      - key: STORAGE_BACKEND
        value: local
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: ENABLE_OPENCODE_SIDECAR
        value: "false"
      - key: OPENCODE_SERVER_URL
        value: http://127.0.0.1:4096
      - key: OPENCODE_SERVER_PASSWORD
        sync: false
      - key: OPENCODE_MODEL
        value: opencode/big-pickle
      - key: MVP_BUILD_DIR
        value: /workspace
      - key: MVP_BUILD_TIMEOUT
        value: "600"
      - key: MVP_VERIFY_INSTALL_TIMEOUT
        value: "180"
      - key: MVP_VERIFY_BUILD_TIMEOUT
        value: "120"
      - key: MVP_VERIFY_NPM
        value: "false"
      - key: ALLOW_ANONYMOUS_AUTH
        value: "true"
      - key: ANONYMOUS_CREDITS
        value: ""
      - key: CORS_ORIGINS
        value: https://ai-solution-builder.onrender.com,https://*.vercel.app
      - key: VERCEL_TOKEN
        sync: false
      - key: VERCEL_TEAM_ID
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: STRIPE_API_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

  # ── Builder (opencode + background worker) ─────────────────────────────────
  - name: ai-solution-builder-builder
    type: worker
    runtime: docker
    plan: starter
    dockerfilePath: ./builder.Dockerfile
    dockerCommand: builder
    envVars:
      - key: APP_NAME
        value: AI Solution Builder
      - key: APP_ENV
        value: production
      - key: APP_ROLE
        value: builder
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL_NAME
        value: openai/gpt-oss-120b
      - key: LLM_PROVIDER
        value: groq
      - key: STORAGE_BACKEND
        value: local
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: WORKER_MODE
        value: worker
      - key: WORKER_POLL_INTERVAL
        value: "2.0"
      - key: MVP_BUILD_DIR
        value: /workspace
      - key: MVP_BUILD_TIMEOUT
        value: "600"
      - key: MVP_VERIFY_INSTALL_TIMEOUT
        value: "180"
      - key: MVP_VERIFY_BUILD_TIMEOUT
        value: "120"
      - key: OPENCODE_SERVER_PASSWORD
        sync: false
      - key: OPENCODE_MODEL
        value: opencode/big-pickle