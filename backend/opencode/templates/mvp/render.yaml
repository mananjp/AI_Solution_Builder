# Render Blueprint — https://render.com/docs/blueprint-spec
# Push this file to your repo's root; Render auto-detects it and offers
# one-click "Deploy to Render".

databases:
  # ── PostgreSQL ────────────────────────────────────────────────────────
  - name: __APP_SLUG__-db
    databaseName: __APP_DB_NAME__
    user: __APP_DB_NAME__
    plan: free
    ipAllowList: []

services:
  # ── Unified Web App (Next.js Frontend + FastAPI Backend) ─────────────
  - name: __APP_SLUG__-web
    type: web
    runtime: docker
    plan: free
    dockerContext: .
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_NAME
        value: __APP_NAME__
      - key: APP_TITLE
        value: __APP_TITLE__
      - key: APP_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: __APP_SLUG__-db
          property: connectionString
      - key: PORT
        value: 3000
    healthCheckPath: /api/v1/health