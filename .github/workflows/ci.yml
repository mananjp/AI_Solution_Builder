name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (lint → type → test → build → security)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_solution_builder_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check . && ruff format --check .

      - name: Type check (mypy)
        run: mypy app/

      - name: Migrate test database
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5433/ai_solution_builder_test
        run: alembic upgrade head

      - name: Unit + integration tests
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5433/ai_solution_builder_test
          REDIS_URL: redis://localhost:6379/0
          LLM_PROVIDER: mock
        run: pytest tests/ -v --cov=app --cov-report=term-missing

      - name: Security audit (pip-audit)
        run: pip install pip-audit && pip-audit -r requirements.txt

  frontend:
    name: Frontend (lint · build)
    defaults:
      run:
        working-directory: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  docker:
    name: Build → scan → push → deploy (main only)
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag and registry prefix
        id: meta
        run: |
          echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          # GHCR requires lowercase repository owner/names
          IMAGE_PREFIX="ghcr.io/${{ github.repository_owner }}"
          echo "image_prefix=$(echo "$IMAGE_PREFIX" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build app image
        run: docker build -f app.Dockerfile -t ai-solution-builder-app:${{ steps.meta.outputs.tag }} .

      - name: Build builder image
        run: docker build -f builder.Dockerfile -t ai-solution-builder-builder:${{ steps.meta.outputs.tag }} .

      - name: Scan app image (dockle)
        uses: goodwithtech/dockle-action@main
        with:
          image: ai-solution-builder-app:${{ steps.meta.outputs.tag }}
          format: list
          exit-code: "0"
          exit-level: fatal

      - name: Scan builder image (dockle)
        uses: goodwithtech/dockle-action@main
        with:
          image: ai-solution-builder-builder:${{ steps.meta.outputs.tag }}
          format: list
          exit-code: "0"
          exit-level: fatal

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        run: |
          PREFIX="${{ steps.meta.outputs.image_prefix }}"
          TAG="${{ steps.meta.outputs.tag }}"
          for img in ai-solution-builder-app ai-solution-builder-builder; do
            docker tag ${img}:${TAG} ${PREFIX}/${img}:${TAG}
            docker push ${PREFIX}/${img}:${TAG}
            docker tag ${img}:${TAG} ${PREFIX}/${img}:latest
            docker push ${PREFIX}/${img}:latest
          done

      - name: Trigger Render redeploy
        if: vars.DEPLOY_SKIP != 'true'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_WEB_SERVICE_ID: ${{ secrets.RENDER_WEB_SERVICE_ID }}
          RENDER_PRIVATE_SERVICE_ID: ${{ secrets.RENDER_PRIVATE_SERVICE_ID }}
        run: |
          curl -fsS -X POST \
            "https://api.render.com/v1/services/${RENDER_WEB_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" -H "Accept: application/json"
          curl -fsS -X POST \
            "https://api.render.com/v1/services/${RENDER_PRIVATE_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" -H "Accept: application/json"